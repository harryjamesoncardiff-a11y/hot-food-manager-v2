<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hot Food Manager V4</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>body{font-family:Arial;margin:15px;background:#f4f4f4} .card{background:#fff;padding:12px;border-radius:8px;margin-bottom:12px}.dark{background:#1f1f1f;color:#fff}.dark .card{background:#333}button,input{padding:8px;margin:4px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px}#seatMap{max-height:450px;overflow:auto}.row{display:flex;gap:4px;margin-bottom:4px}.seat{width:40px;height:40px;border:none;border-radius:6px}.empty{background:#ddd}.selected{background:#2196f3;color:#fff}.pending{background:#ff9800;color:#fff}.served{background:#4caf50;color:#fff}.aisle{width:16px}textarea{width:100%;height:220px}</style></head><body><h1>🍔 Hot Food Manager V4</h1><button onclick="document.body.classList.toggle('dark')">Dark Mode</button><div class='card'><h2>Flight</h2><input id='flightNumber' placeholder='Flight Number'><button onclick='saveFlight()'>Save Flight</button></div><div class='card'><h2>Menu</h2><input id='itemName' placeholder='Item'><input id='itemStock' type='number' placeholder='Stock'><button onclick='addMenuItem()'>Add Item</button><div id='foodButtons'></div><div>Selected Food: <b id='selectedFoodLabel'>None</b></div><table><tbody id='menuTable'></tbody></table></div><div class='card'><h2>Seat Map</h2><b id='selectedSeatLabel'>None</b><div id='seatMap'></div></div><div class='card'><input id='qty' type='number' value='1'><button onclick='addOrder()'>Add Order</button></div><div class='card'><h2>Zone Filter</h2><button onclick="showZone('ALL')">All</button><button onclick="showZone('A')">A</button><button onclick="showZone('B')">B</button><button onclick="showZone('C')">C</button><button onclick="showZone('D')">D</button></div><div class='card'><h2>Orders</h2><table><thead><tr><th>Seat</th><th>Item</th><th>Qty</th><th>Status</th></tr></thead><tbody id='ordersTable'></tbody></table></div><div class='card'><h2>Cook Totals</h2><div id='cookTotals'></div></div><div class='card'><h2>Crew Zones</h2><textarea id='crewList'></textarea><button onclick='exportPDF()'>Export PDF</button></div><script>let menu=JSON.parse(localStorage.getItem('menu')||'[]');let orders=JSON.parse(localStorage.getItem('orders')||'[]');let selectedSeat='';let selectedFood=null;let currentZone='ALL';function save(){localStorage.setItem('menu',JSON.stringify(menu));localStorage.setItem('orders',JSON.stringify(orders));}function saveFlight(){localStorage.setItem('flightNumber',flightNumber.value)}function loadFlight(){flightNumber.value=localStorage.getItem('flightNumber')||''}function addMenuItem(){let n=itemName.value.trim();let s=parseInt(itemStock.value);if(!n||isNaN(s))return;menu.push({id:Date.now(),name:n,stock:s});save();render()}function remaining(id){let m=menu.find(x=>x.id===id);return (m?m.stock:0)-orders.filter(o=>o.itemId===id).reduce((a,b)=>a+b.qty,0)}function selectFood(id){selectedFood=id;selectedFoodLabel.innerText=menu.find(x=>x.id===id).name}function addOrder(){if(!selectedSeat||!selectedFood)return alert('Select seat and food');let q=parseInt(qty.value)||1;if(q>remaining(selectedFood))return alert('Low stock');let e=orders.find(o=>o.seat===selectedSeat&&o.itemId===selectedFood);if(e)e.qty+=q;else orders.push({id:Date.now(),seat:selectedSeat,itemId:selectedFood,qty:q,served:false});save();render()}function selectSeat(s){selectedSeat=s;selectedSeatLabel.innerText=s;renderSeatMap()}function showZone(z){currentZone=z;renderOrders()}function renderSeatMap(){let h='';for(let r=1;r<=40;r++){h+='<div class=row>';['A','B','C','D','E','F'].forEach(l=>{let s=r+l,c='empty';let so=orders.filter(o=>o.seat===s);if(so.length)c=so.every(o=>o.served)?'served':'pending';if(selectedSeat===s)c='selected';h+=`<button class="seat ${c}" onclick="selectSeat('${s}')">${s}</button>`;if(l==='C')h+='<div class=aisle></div>';});h+='</div>'}seatMap.innerHTML=h}function renderOrders(){ordersTable.innerHTML='';let filtered=orders.filter(o=>{let r=parseInt(o.seat);if(currentZone==='ALL')return true;if(currentZone==='A')return r<=10;if(currentZone==='B')return r>=11&&r<=20;if(currentZone==='C')return r>=21&&r<=30;return r>=31});filtered.forEach(o=>{let m=menu.find(x=>x.id===o.itemId);ordersTable.innerHTML+=`<tr><td>${o.seat}</td><td>${m?.name||''}</td><td>${o.qty}</td><td>${o.served?'✅':'☐'}</td></tr>`})}async function exportPDF(){const {jsPDF}=window.jspdf;let doc=new jsPDF();doc.text('Hot Food Report',10,10);doc.text('Flight: '+(localStorage.getItem('flightNumber')||''),10,20);let y=30;orders.forEach(o=>{let m=menu.find(x=>x.id===o.itemId);doc.text(`${o.seat} - ${m.name} x${o.qty}`,10,y);y+=8});doc.save('hot-food-report.pdf')}function render(){menuTable.innerHTML='';foodButtons.innerHTML='';let totals={};let grouped={};menu.forEach(m=>{foodButtons.innerHTML+=`<button onclick='selectFood(${m.id})'>${m.name}</button>`;menuTable.innerHTML+=`<tr><td>${m.name}</td><td>${remaining(m.id)}/${m.stock}</td></tr>`});orders.forEach(o=>{let m=menu.find(x=>x.id===o.itemId);totals[m.name]=(totals[m.name]||0)+o.qty;(grouped[o.seat]=grouped[o.seat]||[]).push(m.name+' x'+o.qty)});cookTotals.innerHTML=Object.keys(totals).map(k=>k+' x '+totals[k]).join('<br>');let A=[],B=[],C=[],D=[];Object.keys(grouped).forEach(seat=>{let row=parseInt(seat);let line=seat+' - '+grouped[seat].join(', ');if(row<=10)A.push(line);else if(row<=20)B.push(line);else if(row<=30)C.push(line);else D.push(line)});crewList.value='ZONE A
'+A.join('
')+'

ZONE B
'+B.join('
')+'

ZONE C
'+C.join('
')+'

ZONE D
'+D.join('
');renderOrders();renderSeatMap()}loadFlight();render();</script></body></html>
